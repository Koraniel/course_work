defaults:
  - model: aasist2_model
  - metrics: aasist2_metrics
  - datasets: aasist2_datasets_eval # we do not want to run inference on training data
  - dataloader: aasist2_dataloader
  - transforms: aasist2_transforms
  - _self_
inferencer:
  device_tensors: ["data_object", "labels"] # which tensors should be on device (ex. GPU)
  device: auto # device name or "auto"
  save_path: "example" # any name here, can be a dataset name
  seed: 1
  skip_model_load: true
  # from_pretrained: "saved/model_best.pth" # path to the pretrained model
