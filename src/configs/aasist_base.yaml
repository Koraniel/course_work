defaults:
  - model: aasist_model
  - writer: wandb
  - metrics: aasist_metrics
  - datasets: aasist_datasets
  - dataloader: aasist_dataloader
  - transforms: aasist_transforms
  - _self_
optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4
lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.9
  step_size: ${trainer.epoch_len}
loss_function:
  _target_: src.loss.AASIST_Loss
trainer:
  log_step: 10
  n_epochs: 100
  epoch_len: 2115 # HOW am I supposed to know this? I do not know len of dataset, so I NEED to write null. But thisleads to TypeError!
  device_tensors: ["data_object", "labels"]
  resume_from: null
  device: auto
  override: True
  monitor: "off" # off because there are 2 metrics we monitor, don't know how to deal with it on this template
  save_period: 5
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 1
